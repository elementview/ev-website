<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EV Website - 占位页</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--muted:#9aa4b2;--accent:#22c55e}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#071028 0%,var(--bg) 100%);color:#e6eef8}
    .card{max-width:880px;margin:24px;padding:32px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:12px;box-shadow:0 6px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0 0 18px;color:var(--muted)}
    .actions{display:flex;gap:12px}
    a.button{display:inline-block;padding:10px 16px;border-radius:8px;text-decoration:none;color:#06201b;background:#a7f3d0;font-weight:600}
    footer{margin-top:18px;font-size:13px;color:var(--muted)}
    @media (max-width:520px){.card{padding:20px}h1{font-size:22px}}
  </style>
</head>
<body>
  <main class="card">
    <h1>ElementView 项目官网</h1>
    <p>这是一个默认的占位首页。后续你可以在此处替换为自己的设计、组件和内容。当前页面仅用于快速搭建网站根路径（index.html）。</p>
    <div class="actions">
      <a class="button" href="https://github.com/elementview/ev-website" target="_blank" rel="noopener noreferrer">查看仓库</a>
      <a class="button" href="#" style="background:transparent;color:#9aa4b2;border:1px solid rgba(255,255,255,0.04)">自定义页面</a>
    </div>
    <footer>
      提示：将此文件替换或在同一目录添加静态资源（styles/, scripts/）即可开始开发。 — 自动生成
    </footer>
  </main>
</body>
</html>
