<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ElementView — 轻量化 3D viewer：Revit 模型一键导出为独立 EXE，查看方无需安装任何软件。Lightweight 3D viewer: export Revit models to a standalone EXE with zero installation required." />
  <title>ElementView · 轻量化 3D Viewer</title>
  <link rel="icon" type="image/svg+xml" href="assets/elementview-logo.svg" />
  <style>
    :root{
      --bg:#0e1116; --surface:#161b22; --surface2:#1c2128; --line:#30363d;
      --ink:#e8eaed; --ink2:#adbac7; --ink3:#768390;
      --gold:#3fb950; --primary:#4f6df5; --primary-hover:#3d5ad6; --primary-subtle:rgba(79,109,245,.16);
      --radius:14px; --radius-sm:8px;
      --font-sans:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,Segoe UI,Roboto,sans-serif;
      --font-mono:"JetBrains Mono","SF Mono",Consolas,monospace;
      --glow:0 0 0 1px rgba(79,109,245,.25), 0 20px 60px -20px rgba(0,0,0,.6);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
    a{color:var(--primary);text-decoration:none}
    a:hover{text-decoration:underline}
    img{max-width:100%;display:block}
    .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

    /* Nav */
    nav{position:sticky;top:0;z-index:50;background:rgba(14,17,22,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    nav .wrap{display:flex;align-items:center;gap:24px;height:60px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--ink)}
    .brand:hover{text-decoration:none}
    .brand img{width:26px;height:26px}
    .nav-links{display:flex;gap:18px;margin-left:auto}
    .nav-links a{color:var(--ink2,#adbac7);font-size:14px}
    .nav-links a:hover{color:var(--ink);text-decoration:none}
    .lang-switch{display:flex;align-items:center;gap:4px;font-size:13px}
    .lang-switch button{background:transparent;border:1px solid var(--line);color:var(--ink2,#adbac7);padding:5px 10px;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit}
    .lang-switch button.active{background:var(--primary-subtle);color:var(--primary);border-color:var(--primary)}
    .lang-switch button:hover{color:var(--ink)}

    /* Hero */
    header.hero{padding:72px 0 56px;background:
      radial-gradient(900px 420px at 15% -10%, rgba(79,109,245,.18), transparent 60%),
      radial-gradient(700px 380px at 90% 0%, rgba(63,185,80,.10), transparent 60%), var(--bg)}
    .hero-grid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:36px}
    .hero-copy{max-width:760px}
    .badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2,#adbac7);background:var(--surface);border:1px solid var(--line);padding:6px 14px;border-radius:999px;margin-bottom:14px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
    h1{font-size:clamp(30px,4.5vw,46px);line-height:1.15;margin:0 0 18px;letter-spacing:-.5px}
    .sub{font-size:17px;color:var(--ink2,#adbac7);max-width:560px;margin:0 auto 28px}
    .cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;cursor:pointer;border:none;font-family:inherit}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-hover);text-decoration:none;box-shadow:0 6px 20px -4px rgba(79,109,245,.5)}
    .btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
    .btn-ghost:hover{background:var(--surface2);text-decoration:none}
    .hero-meta{margin-top:26px;font-size:13px;color:var(--ink3,#768390)}
    .hero-meta b{color:var(--ink2,#adbac7)}
    .btn .arrow{transition:transform .2s}
    .btn-primary:hover .arrow{transform:translateX(3px)}

    /* Screenshot */
    .shot{position:relative;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface2);overflow:hidden;box-shadow:var(--glow);line-height:0}
    .shot img{width:100%;height:auto;display:block}

    /* Sections */
    section{padding:64px 0;border-top:1px solid var(--line)}
    #feedback{border-top:none;padding-top:56px}
    .section-title{text-align:center;max-width:640px;margin:0 auto 44px}
    .section-title .kicker{display:inline-block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--primary);margin-bottom:8px;font-weight:600}
    .section-title h2{font-size:clamp(24px,3vw,32px);margin:0 0 10px;letter-spacing:-.3px}
    .section-title p{color:var(--ink2,#adbac7);margin:0}

    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:step}
    .step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px 22px}
    .step::before{counter-increment:step;content:counter(step,decimal-leading-zero);position:absolute;top:18px;right:18px;font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--primary);opacity:.3}
    .step h3{margin:0 0 6px;font-size:17px}
    .step p{margin:0;color:var(--ink2,#adbac7);font-size:14px}
    .step .tag{display:inline-block;margin-top:12px;font-size:12px;font-family:var(--font-mono);color:var(--gold);border:1px solid var(--line);padding:2px 8px;border-radius:6px}

    #download{background:radial-gradient(800px 300px at 50% 120%, rgba(79,109,245,.16), transparent 70%), var(--bg)}
    .download-panel{max-width:720px;margin:44px auto 0;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:44px 34px;box-shadow:var(--glow)}
    .download-panel h2{margin:0 0 10px;font-size:clamp(24px,3vw,30px)}
    .download-panel>p{color:var(--ink2,#adbac7);margin:0 0 26px}
    .big-cta{display:flex;flex-direction:column;gap:10px;align-items:center}
    .btn-xl{padding:16px 30px;font-size:17px}
    .need{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3,#768390)}
    .need .checkb{color:var(--gold)}

    .changelog{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
    .cl-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
    .cl-item:last-child{border-bottom:none}
    .cl-ver{font-family:var(--font-mono);color:var(--primary);font-size:13px;min-width:90px}
    .cl-desc{color:var(--ink2,#adbac7);font-size:14px}
    .placeholder{color:var(--ink3,#768390);font-style:italic}

    footer{border-top:1px solid var(--line);padding:40px 0 60px;color:var(--ink3,#768390);font-size:14px}
    .foot-grid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
    .foot-col h4{color:var(--ink2,#adbac7);margin:0 0 10px;font-size:14px}
    .foot-col a{display:block;color:var(--ink3,#768390);margin:4px 0}
    .foot-col a:hover{color:var(--ink)}

    @media (max-width:900px){
      .hero-grid{gap:28px}
      .steps{grid-template-columns:1fr 1fr}
    }
    @media (max-width:640px){
      .hero{padding:48px 0}
      .steps{grid-template-columns:1fr}
      nav .wrap{gap:12px}
      .nav-links a{display:none}
      .btn{width:100%;justify-content:center}
      .cta{flex-direction:column}
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="wrap">
      <a class="brand" href="#top">
        <img src="assets/elementview-logo.svg" alt="ElementView logo" />
        <span>ElementView</span>
      </a>
      <div class="nav-links">
        <a href="#how" data-i18n="nav_how"></a>
        <a href="#download" data-i18n="nav_download"></a>
        <a href="#feedback" data-i18n="nav_feedback"></a>
      </div>
      <div class="lang-switch" id="langSwitch">
        <button data-lang="zh-CN" class="active">中文</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <header class="hero" id="top">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <span class="badge"><span class="dot"></span><span data-i18n="hero_badge"></span></span>
        <h1 data-i18n="hero_title"></h1>
        <p class="sub" data-i18n="hero_sub"></p>
        <div class="cta">
          <a class="btn btn-primary" href="https://github.com/elementview/EV-Revit-Plugin/releases" target="_blank" rel="noopener noreferrer">
            <span data-i18n="hero_dl_download"></span><span class="arrow">→</span>
          </a>
          <a class="btn btn-ghost" href="#how" data-i18n="hero_cta_how"></a>
        </div>
        <div class="hero-meta">
          <span style="color:var(--ink3,#768390)"><span data-i18n="hero_meta_revit"></span><b style="color:var(--ink2,#adbac7)">Revit 2020, Revit 2026, Revit 2027</b></span>
        </div>
      </div>

      <div class="shot">
        <img src="assets/app.png" alt="ElementView — 3D viewer preview" />
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- HOW -->
    <section id="how">
      <div class="section-title">
        <span class="kicker" data-i18n="how_kicker"></span>
        <h2 data-i18n="how_title"></h2>
        <p data-i18n="how_sub"></p>
      </div>
      <div class="steps">
        <div class="step"><h3 data-i18n="how1_title"></h3><p data-i18n="how1_desc"></p><span class="tag" data-i18n="how1_tag"></span></div>
        <div class="step"><h3 data-i18n="how2_title"></h3><p data-i18n="how2_desc"></p><span class="tag" data-i18n="how2_tag"></span></div>
        <div class="step"><h3 data-i18n="how3_title"></h3><p data-i18n="how3_desc"></p><span class="tag" data-i18n="how3_tag"></span></div>
      </div>
    </section>

    <!-- DOWNLOAD -->
    <section id="download">
      <div class="wrap">
        <div class="section-title">
          <span class="kicker" data-i18n="dl_kicker"></span>
          <h2 data-i18n="dl_title"></h2>
          <p data-i18n="dl_sub"></p>
        </div>
        <div class="download-panel">
          <div class="big-cta">
            <a class="btn btn-primary btn-xl" href="https://github.com/elementview/EV-Revit-Plugin/releases" target="_blank" rel="noopener noreferrer">
              <span data-i18n="dl_cta"></span><span class="arrow">↗</span>
            </a>
            <p class="need"><span class="checkb">✓</span><span data-i18n="dl_need"></span></p>
          </div>
        </div>
      </div>
    </section>

    <!-- CHANGELOG -->
    <section id="changelog">
      <div class="section-title">
        <span class="kicker" data-i18n="cl_kicker"></span>
        <h2 data-i18n="cl_title"></h2>
      </div>
      <div class="changelog">
        <div class="cl-item">
          <span class="cl-ver">v26.9.0</span>
          <span class="cl-desc" data-i18n="cl_v2690"></span>
        </div>
        <div class="cl-item">
          <span class="cl-ver">v26.8.0</span>
          <span class="cl-desc" data-i18n="cl_v2680"></span>
        </div>
      </div>
    </section>
  </main>

  <!-- FEEDBACK -->
  <section id="feedback">
    <div class="wrap">
      <div class="section-title">
        <span class="kicker" data-i18n="fb_kicker"></span>
        <h2 data-i18n="fb_title"></h2>
        <p data-i18n="fb_sub"></p>
      </div>
      <div style="text-align:center">
        <a class="btn btn-primary" href="https://github.com/elementview/EV-Revit-Plugin/discussions" target="_blank" rel="noopener noreferrer"><span data-i18n="fb_cta"></span><span class="arrow">↗</span></a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="wrap">
      <div class="foot-grid">
        <div class="foot-links">
          <h4>ElementView</h4>
          <a data-i18n="ft_repo" href="https://github.com/elementview/EV-Revit-Plugin"></a>
        </div>
        <div class="foot-links">
          <h4 data-i18n="ft_nav"></h4>
          <a href="#how" data-i18n="nav_how"></a>
          <a href="#download" data-i18n="nav_download"></a>
          <a href="#feedback" data-i18n="nav_feedback"></a>
        </div>
        <p style="max-width:340px;font-size:13px;color:var(--ink3,#768390)" data-i18n="ft_about"></p>
      </div>
    </div>
  </footer>

  <!-- I18N -->
  <script>
    const I18N = {
      "zh-CN": {
        nav_how:"使用流程", nav_download:"下载", nav_feedback:"反馈",
        hero_badge:"轻量 · 免费 · 零门槛查看",
        hero_title:"Revit 模型，一键导出为<br>无需安装的 3D 查看器",
        hero_sub:"ElementView 是一个轻量化的 3D viewer。从 Revit 导出的模型直接是一个独立可执行文件，查看方不需要安装 Revit、也不需要安装任何其他软件，直接双击即可查看。",
        hero_dl_download:"立即下载", hero_cta_how:"查看使用流程",
        hero_meta_revit:"支持 Revit 版本：",
        how_kicker:"使用流程", how_title:"三步完成交付", how_sub:"从 Revit 到可分享的独立查看器，只需几步。",
        how1_title:"在 Revit 中导出", how1_desc:"安装插件，选择模型，一键导出为独立查看器。", how1_tag:"Revit",
        how2_title:"得到独立 EXE", how2_desc:"生成一个可独立运行的可执行文件，内含全部模型数据。", how2_tag:"EXE",
        how3_title:"发送给任何人", how3_desc:"通过邮件或网盘分享，对方在任意 Windows 上双击即用，无需安装。", how3_tag:"交付",
        dl_kicker:"下载", dl_title:"立即获取 ElementView", dl_sub:"下载最新版 Revit 插件，把模型变成独立的 3D 查看器。",
        dl_cta:"前往 GitHub Releases 下载", dl_need:"无需登录 · 免费 · Windows",
        cl_kicker:"更新日志", cl_title:"近期更新", cl_placeholder:"更新日志占位，发布后可在此补充。",
        cl_v2690:"支持 Revit 2020 版本。",
        cl_v2680:"Revit 一键导出，独立 EXE 双击即用。",
        fb_kicker:"反馈", fb_title:"分享你的建议", fb_sub:"有想法或遇到问题？欢迎到 GitHub Discussions 提交反馈，你的意见将帮助我们持续优化 ElementView。", fb_cta:"打开 GitHub Discussions",
        ft_repo:"插件仓库", ft_nav:"导航", ft_about:"ElementView：让 Revit 模型以轻量、独立、零安装的方式交付给每一个人。"
      },
      "en": {
        nav_how:"How it works", nav_download:"Download", nav_feedback:"Feedback",
        hero_badge:"Lightweight · Free · Zero-install viewing",
        hero_title:"Export Revit models to a 3D viewer<br>that needs no installation",
        hero_sub:"ElementView is a lightweight 3D viewer. Models exported from Revit become a standalone executable — recipients need neither Revit nor any other software. Just double-click and it runs.",
        hero_dl_download:"Download now", hero_cta_how:"See how it works",
        hero_meta_revit:"Supported Revit version: ",
        how_kicker:"How it works", how_title:"Deliver in three steps", how_sub:"From Revit to a shareable standalone viewer in minutes.",
        how1_title:"Export in Revit", how1_desc:"Install the plugin, pick a model, and export a standalone viewer in one click.", how1_tag:"Revit",
        how2_title:"Get a standalone EXE", how2_desc:"A self-contained executable is produced, with all model data embedded.", how2_tag:"EXE",
        how3_title:"Send to anyone", how3_desc:"Share by email or cloud link; anyone on Windows just double-clicks to open it.", how3_tag:"Deliver",
        dl_kicker:"Download", dl_title:"Get ElementView now", dl_sub:"Download the latest Revit plugin and turn models into standalone 3D viewers.",
        dl_cta:"Go to GitHub Releases", dl_need:"No sign-up · Free · Windows",
        cl_kicker:"Changelog", cl_title:"Recent updates", cl_placeholder:"Changelog placeholder — fill in after a release.",
        cl_v2690:"Now supports Revit 2020.",
        cl_v2680:"One-click Revit export into a standalone EXE — just double-click and it runs.",
        fb_kicker:"Feedback", fb_title:"Share your feedback", fb_sub:"Have ideas or run into issues? Open a discussion on GitHub — your feedback helps us make ElementView better.", fb_cta:"Open GitHub Discussions",
        ft_repo:"Plugin repository", ft_nav:"Navigate", ft_about:"ElementView: deliver Revit models as lightweight, standalone, zero-install experiences for everyone."
      }
    };

    // ---- Language switching ----
    function applyLang(lang){
      const t = I18N[lang] || I18N["zh-CN"];
      document.querySelectorAll("[data-i18n]").forEach(el=>{
        const key = el.getAttribute("data-i18n");
        if(t[key]!==undefined) el.innerHTML = t[key];
      });
      document.documentElement.lang = lang;
      document.querySelectorAll("#langSwitch button").forEach(b=>b.classList.toggle("active", b.dataset.lang===lang));
      try{ localStorage.setItem("ev-lang", lang); }catch(e){}
    }
    document.querySelectorAll("#langSwitch button").forEach(b=>{
      b.addEventListener("click", ()=>applyLang(b.dataset.lang));
    });
    let saved=""; try{ saved = localStorage.getItem("ev-lang")||""; }catch(e){}
    applyLang(saved && I18N[saved] ? saved : "zh-CN");

  </script>
</body>
</html>
